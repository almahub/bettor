name: Bettor Windows release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: better-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    env:
      OPENAI_USAGE_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build environment
        shell: pwsh
        run: |
          python -m venv .cache/packaging-venv
          .cache/packaging-venv/Scripts/python.exe -m pip install .[dev,desktop] pyinstaller
          New-Item -ItemType Junction -Path .venv -Target (Resolve-Path .cache/packaging-venv).Path | Out-Null
      - name: Tests
        shell: pwsh
        run: |
          .cache/packaging-venv/Scripts/python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem tests/ui/test_*.mjs | ForEach-Object { node --test $_.FullName; if ($LASTEXITCODE -ne 0) { throw "UI tests failed" } }
      - name: Build installer
        shell: pwsh
        run: |
          $Compiler = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe" | Select-Object -First 1
          if (!$Compiler) { throw "Inno Setup compiler missing" }
          ./scripts/build-windows.ps1 -Iscc $Compiler.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: Bettor-Windows-Setup
          path: dist/installer/*
      - name: Publish verified update and retain three releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: .cache/packaging-venv/Scripts/python.exe scripts/publish-release.py --tag "$env:RELEASE_TAG"
